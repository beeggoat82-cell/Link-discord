<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Galerie</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
header{padding:20px;text-align:center;position:sticky;top:0;background:#181818}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;background:#292929;padding:10px 16px;border-radius:10px}
main{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:#1c1c1c;border-radius:12px;padding:12px}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
a{color:#8ec5ff}
</style>
</head>
<body>
<header><h1>Ma Galerie</h1><nav><a href="#photos">Photos</a><a href="#liens">Liens</a><a href="#videos">Vidéos</a></nav></header>
<main>
<section id="photos"><h2>📸 Photos</h2><div class="grid"><div class="card">Galerie photos</div></div></section>
<section id="liens"><h2>🔗 Liens</h2><div class="card">Liens à ajouter</div></section>
<section id="videos"><h2>🎬 Vidéos</h2><div class="card">Vidéos à ajouter</div></section>
</main>
</body>
</html>
